version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Angular majors need `ng update` to run its migration schematics, which
    # Dependabot cannot do. It also bumps only part of the toolchain, leaving the
    # CLI and build tooling a major behind and the lockfile unresolvable. Majors
    # are done by hand, one at a time.
    #
    # zone.js is pinned by Angular's peer range (`~0.14.0` on Angular 17). For
    # 0.x versions Dependabot treats 0.14 → 0.16 as a minor, so ignoring majors
    # alone is not enough — minors must be ignored too. Patches within 0.14.x
    # still come through.
    ignore:
      - dependency-name: '@angular*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zone.js'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      angular:
        patterns:
          - '@angular*'
          - 'zone.js'
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
